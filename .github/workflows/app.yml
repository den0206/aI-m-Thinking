name: App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "scripts/build-app.sh"
      - "scripts/make-dmg.sh"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "scripts/build-app.sh"
      - "scripts/make-dmg.sh"
      - ".github/workflows/app.yml"

permissions:
  contents: read

jobs:
  swift:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          swift --version
          swift --version | grep -q "Apple Swift version 6.4"
      - name: Build
        run: swift build --package-path app
      - name: Test
        run: swift test --package-path app
      - name: Build Debug App Bundle
        run: CONFIG=debug bash scripts/build-app.sh
      - name: Verify Debug Bundle
        run: |
          test -x ".build/debug/aI'm Thinking Debug.app/Contents/MacOS/AImThinking"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ".build/debug/aI'm Thinking Debug.app/Contents/Info.plist")" = "com.den0206.AImThinking.debug"

      - name: Build App Store Smoke Bundle
        run: CONFIG=appstore-smoke bash scripts/build-app.sh
      - name: Verify App Store Sandbox Entitlements
        run: |
          APP=".build/appstore-smoke/aI'm Thinking App Store Smoke.app"
          CORE="$APP/Contents/MacOS/im-thinking-core"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AImThinkingDistribution' "$APP/Contents/Info.plist")" = "app-store"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          ls "$APP/Contents/Resources/Sounds/kc1000/"*.wav >/dev/null
          for asset in rain.m4a thunder.m4a page-turn.m4a; do
            test -s "$APP/Contents/Resources/Ambient/$asset"
          done
          codesign --display --entitlements - --xml "$APP" 2>/dev/null | plutil -convert xml1 -o "$RUNNER_TEMP/app-entitlements.plist" -
          codesign --display --entitlements - --xml "$CORE" 2>/dev/null | plutil -convert xml1 -o "$RUNNER_TEMP/core-entitlements.plist" -
          grep -q '<key>com.apple.security.app-sandbox</key>' "$RUNNER_TEMP/app-entitlements.plist"
          grep -q '<key>com.apple.security.files.user-selected.read-only</key>' "$RUNNER_TEMP/app-entitlements.plist"
          grep -q '<key>com.apple.security.app-sandbox</key>' "$RUNNER_TEMP/core-entitlements.plist"
          grep -q '<key>com.apple.security.inherit</key>' "$RUNNER_TEMP/core-entitlements.plist"
          ! grep -q '<key>com.apple.security.files.user-selected.read-only</key>' "$RUNNER_TEMP/core-entitlements.plist"

      - name: Build App Bundle
        run: bash scripts/build-app.sh
      - name: Verify Bundle
        run: |
          test -x ".build/release/aI'm Thinking.app/Contents/MacOS/AImThinking"
          test -x ".build/release/aI'm Thinking.app/Contents/MacOS/im-thinking-core"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' ".build/release/aI'm Thinking.app/Contents/Info.plist")" = "26.0"
          plutil -lint ".build/release/aI'm Thinking.app/Contents/Info.plist"

      - name: Build Test DMG
        run: |
          bash scripts/make-dmg.sh             ".build/release/aI'm Thinking.app"             "$RUNNER_TEMP/aIm-Thinking-test.dmg"             "aI'm Thinking Test"
          hdiutil imageinfo "$RUNNER_TEMP/aIm-Thinking-test.dmg" >/dev/null
