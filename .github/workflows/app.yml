name: App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "scripts/build-app.sh"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "scripts/build-app.sh"
      - ".github/workflows/app.yml"

permissions:
  contents: read

jobs:
  swift:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          swift --version
          swift --version | grep -q "Apple Swift version 6.4"
      - name: Build
        run: swift build --package-path app
      - name: Test
        run: swift test --package-path app
      - name: Build Debug App Bundle
        run: CONFIG=debug bash scripts/build-app.sh
      - name: Verify Debug Bundle
        run: |
          test -x ".build/debug/I'm Thinking Debug.app/Contents/MacOS/ImThinking"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ".build/debug/I'm Thinking Debug.app/Contents/Info.plist")" = "com.den0206.ImThinking.debug"

      - name: Build App Bundle
        run: bash scripts/build-app.sh
      - name: Verify Bundle
        run: |
          test -x ".build/release/I'm Thinking.app/Contents/MacOS/ImThinking"
          test -x ".build/release/I'm Thinking.app/Contents/MacOS/im-thinking-core"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' ".build/release/I'm Thinking.app/Contents/Info.plist")" = "26.0"
          plutil -lint ".build/release/I'm Thinking.app/Contents/Info.plist"
