name: Core

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # macOS minutes cost 10x. The macOS-only code (core/src/sandbox.rs) is still compiled by the
    # App workflow, which also runs on core/** changes, and is linted by the Release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
