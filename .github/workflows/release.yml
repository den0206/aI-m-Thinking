name: Release

on:
  push:
    branches: ['release/Ver_*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    # A step waiting on a keychain prompt or Apple's servers must fail instead of running for 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#release/Ver_}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release branch must be release/Ver_X.Y.Z (received: $GITHUB_REF_NAME)"
            exit 1
          fi

          EXISTING="$(git ls-remote --tags origin | sed -n 's#.*refs/tags/v\([0-9][0-9.+]*\)$#\1#p' | sort -u)"

          # A typo in the branch name must not publish an older version.
          HIGHEST="$(printf '%s\n' "$EXISTING" | sed 's/+.*//' | sort -V | tail -1)"
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is older than the latest release $HIGHEST. Check the branch name."
            exit 1
          fi

          # Re-releasing the same version keeps the earlier releases and tags this one vX.Y.Z+N.
          # The app and the App Store keep X.Y.Z; only the build number grows.
          # Re-running for the same commit (e.g. after an App Store failure) reuses its release.
          REUSED="$(git ls-remote --tags origin | awk -v sha="$GITHUB_SHA" -v v="v$VERSION" \
            '$1 == sha { t = $2; sub(/^refs\/tags\//, "", t); if (t == v || index(t, v "+") == 1) print t }' | head -1)"
          TAG="v$VERSION"
          if [ -n "$REUSED" ]; then
            TAG="$REUSED"
            echo "::notice::$GITHUB_SHA is already released as $TAG, reusing it"
          elif printf '%s\n' "$EXISTING" | grep -Fxq "$VERSION"; then
            N=1
            while printf '%s\n' "$EXISTING" | grep -Fxq "$VERSION+$N"; do N=$((N + 1)); done
            TAG="v$VERSION+$N"
            echo "::notice::v$VERSION already exists, releasing as $TAG"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dmg=aIm-Thinking-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Verify toolchain
        run: |
          swift --version
          swift --version | grep -q 'Apple Swift version 6.4'

      - name: Verify tests
        run: |
          cargo test --manifest-path core/Cargo.toml
          cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
          swift test --package-path app

      - name: Cut changelog section
        run: |
          scripts/release-changelog.sh --check
          scripts/release-changelog.sh "${{ steps.meta.outputs.version }}" "$(date -u +%F)"
          scripts/release-changelog.sh --section "${{ steps.meta.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Require signing and notarization secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY KEYCHAIN_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD \
            MAS_CERT_P12 MAS_CERT_PASSWORD MAS_PROVISIONING_PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for public release"
              exit 1
            fi
          done

      # Approved or released App Store versions cannot take a new build. Stop before anything is
      # rebuilt or the existing GitHub Release is replaced.
      - name: Check App Store version can take a new build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          ASC_KEY_P8="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" scripts/appstore-release.sh --check "${{ steps.meta.outputs.version }}"

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # All three certificates share one private key, and only the first import sets its ACL
          # (later imports skip the existing key). Allow productbuild here too, or productbuild --sign
          # waits on a SecurityAgent prompt that nobody can answer on the runner.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          # Apple Distribution + Mac Installer Distribution, exported together into one .p12.
          printf '%s' "$MAS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$KEYCHAIN" -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # productbuild is given this keychain explicitly (--keychain in build-app.sh), so it
          # need not be the default. hdiutil's "Resource busy" is retried in make-dmg.sh.
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed app
        timeout-minutes: 5
        env:
          MARKETING_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-app.sh

      - name: Notarize and staple app
        timeout-minutes: 15
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          APP=".build/release/aI'm Thinking.app"
          ZIP="$RUNNER_TEMP/aIm-Thinking.zip"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Create DMG
        timeout-minutes: 5
        run: |
          bash scripts/make-dmg.sh \
            ".build/release/aI'm Thinking.app" \
            "${{ steps.meta.outputs.dmg }}" \
            "aI'm Thinking ${{ steps.meta.outputs.version }}"

      - name: Sign DMG
        run: codesign --force --timestamp --sign "$SIGN_IDENTITY" "${{ steps.meta.outputs.dmg }}"

      - name: Notarize and staple DMG
        timeout-minutes: 15
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          DMG="${{ steps.meta.outputs.dmg }}"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify release artifact
        run: |
          DMG="${{ steps.meta.outputs.dmg }}"
          codesign --verify --verbose=2 "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG" || true

      # Built before the GitHub Release so a signing failure does not leave a release behind.
      # Signing only takes seconds; a hang here means a keychain prompt, so fail fast.
      - name: Build App Store package
        timeout-minutes: 3
        env:
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          MARKETING_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # +100 keeps CI builds above the builds uploaded by hand before CI existed (0.1.0 build 2).
          BUILD_NUMBER="$((100 + GITHUB_RUN_NUMBER)).$GITHUB_RUN_ATTEMPT"
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/mas.provisionprofile"
          echo "MAS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MAS_PKG=.build/appstore/aIm-Thinking-$MARKETING_VERSION-$BUILD_NUMBER.pkg" >> "$GITHUB_ENV"
          # Names only, so a missing identity shows up here instead of as a hang.
          security find-identity -v "$SIGNING_KEYCHAIN" | sed -n 's/.*"\(.*\)"/\1/p'
          BUILD_NUMBER="$BUILD_NUMBER" CONFIG=appstore \
          SIGN_IDENTITY="Apple Distribution: Yuuki Sakai (4KJFNVZ8R6)" \
          INSTALLER_IDENTITY="3rd Party Mac Developer Installer: Yuuki Sakai (4KJFNVZ8R6)" \
          PROVISIONING_PROFILE="$RUNNER_TEMP/mas.provisionprofile" \
            bash scripts/build-app.sh &
          BUILD=$!
          # productbuild --sign has hung here with no output. If it does again, record where it
          # waits (Apple DTS suggests spindump) and whether a keychain prompt (SecurityAgent) is up.
          for _ in $(seq 120); do kill -0 "$BUILD" 2>/dev/null || break; sleep 1; done
          if kill -0 "$BUILD" 2>/dev/null; then
            echo "::error::App Store package build did not finish in 2 minutes"
            pgrep -lf 'SecurityAgent|productbuild|productsign' || true
            sudo spindump productbuild 5 -stdout 2>&1 | head -300 || true
            pkill -x productbuild || true
            kill "$BUILD" || true
            exit 1
          fi
          wait "$BUILD"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          DMG: ${{ steps.meta.outputs.dmg }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" "$DMG" \
            --target "$GITHUB_SHA" \
            --title "aI'm Thinking ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # --wait covers App Store Connect processing, which usually takes 5-30 minutes.
      - name: Upload App Store package
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # altool reads AuthKey_<id>.p8 from API_PRIVATE_KEYS_DIR.
          API_PRIVATE_KEYS_DIR="$(dirname "$ASC_KEY_P8")" \
            xcrun altool --upload-package "$MAS_PKG" --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" --wait

      # Polls for the build (up to 10 min) and for a review cancellation (up to 10 min).
      - name: Submit to App Store review
        timeout-minutes: 25
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/appstore-release.sh "${{ steps.meta.outputs.version }}" "$MAS_BUILD_NUMBER" "$RUNNER_TEMP/notes.md"

      - name: Sync changelog to main
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -f -C main origin/main
          scripts/release-changelog.sh "$VERSION" "$(date -u +%F)"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: v${VERSION} の CHANGELOG を反映 [skip ci]"
          git push origin main
