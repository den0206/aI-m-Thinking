name: Release

on:
  push:
    branches: ['release/Ver_*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dmg: ${{ steps.meta.outputs.dmg }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#release/Ver_}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release branch must be release/Ver_X.Y.Z (received: $GITHUB_REF_NAME)"
            exit 1
          fi

          EXISTING="$(git ls-remote --tags origin | sed -n 's#.*refs/tags/v\([0-9][0-9.+]*\)$#\1#p' | sort -u)"

          # A typo in the branch name must not publish an older version.
          HIGHEST="$(printf '%s\n' "$EXISTING" | sed 's/+.*//' | sort -V | tail -1)"
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is older than the latest release $HIGHEST. Check the branch name."
            exit 1
          fi

          # Re-releasing the same version keeps the earlier releases and tags this one vX.Y.Z+N.
          # The app and the App Store keep X.Y.Z; only the build number grows.
          # Re-running for the same commit (e.g. after an App Store failure) reuses its release.
          REUSED="$(git ls-remote --tags origin | awk -v sha="$GITHUB_SHA" -v v="v$VERSION" \
            '$1 == sha { t = $2; sub(/^refs\/tags\//, "", t); if (t == v || index(t, v "+") == 1) print t }' | head -1)"
          TAG="v$VERSION"
          if [ -n "$REUSED" ]; then
            TAG="$REUSED"
            echo "::notice::$GITHUB_SHA is already released as $TAG, reusing it"
          elif printf '%s\n' "$EXISTING" | grep -Fxq "$VERSION"; then
            N=1
            while printf '%s\n' "$EXISTING" | grep -Fxq "$VERSION+$N"; do N=$((N + 1)); done
            TAG="v$VERSION+$N"
            echo "::notice::v$VERSION already exists, releasing as $TAG"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dmg=aIm-Thinking-$VERSION.dmg" >> "$GITHUB_OUTPUT"

      - name: Cut changelog section
        run: |
          scripts/release-changelog.sh --check
          scripts/release-changelog.sh "${{ steps.meta.outputs.version }}" "$(date -u +%F)"
          scripts/release-changelog.sh --section "${{ steps.meta.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Require signing and notarization secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD MAS_CERT_P12 MAS_CERT_PASSWORD BUILD_PROVISION_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for public release"
              exit 1
            fi
          done

      # Approved or released App Store versions cannot take a new build. Stop before anything is
      # rebuilt or the existing GitHub Release is replaced.
      - name: Check App Store version can take a new build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          ASC_KEY_P8="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" scripts/appstore-release.sh --check "${{ steps.meta.outputs.version }}"

      - name: Save release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ github.run_number }}
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          overwrite: true

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  release:
    needs: check
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      build_number: ${{ steps.package.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ github.run_number }}
          path: ${{ runner.temp }}

      - name: Verify toolchain
        run: |
          swift --version
          swift --version | grep -q 'Apple Swift version 6.4'

      - name: Verify tests
        run: |
          cargo test --manifest-path core/Cargo.toml
          cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
          swift test --package-path app

      - name: Prepare upload API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # All three certificates share one private key, and only the first import sets its ACL
          # (later imports skip the existing key). Allow productbuild here too, or productbuild --sign
          # waits on a SecurityAgent prompt that nobody can answer on the runner.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          # Apple Distribution + Mac Installer Distribution, exported together into one .p12.
          printf '%s' "$MAS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$KEYCHAIN" -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/developer-id-ca.cer"
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr-ca.cer"
          security import "$RUNNER_TEMP/developer-id-ca.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/wwdr-ca.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # productbuild is given this keychain explicitly (--keychain in build-app.sh), so it
          # need not be the default. hdiutil's "Resource busy" is retried in make-dmg.sh.
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          select_identity() {
            local matches
            matches="$(security find-identity -v "$KEYCHAIN" | awk -v kind="$1: " -v team="($APPLE_TEAM_ID)" 'index($0, kind) && index($0, team) {print $2}')"
            if [ "$(printf '%s\n' "$matches" | awk 'NF {n++} END {print n+0}')" -ne 1 ]; then
              echo "::error::Expected exactly one valid $1 identity for APPLE_TEAM_ID" >&2
              return 1
            fi
            printf '%s\n' "$matches"
          }
          SIGN_IDENTITY="$(select_identity 'Developer ID Application')"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          MAS_SIGN_IDENTITY="$(select_identity 'Apple Distribution')"
          MAS_INSTALLER_DIGEST="$(select_identity '3rd Party Mac Developer Installer')"
          # productbuild requires the certificate's common name, rather than its SHA-1 digest.
          MAS_INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | awk -F '"' -v digest="$MAS_INSTALLER_DIGEST" 'index($1, digest) {print $2}')"
          echo "MAS_SIGN_IDENTITY=$MAS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MAS_INSTALLER_IDENTITY=$MAS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed app
        timeout-minutes: 5
        env:
          MARKETING_VERSION: ${{ needs.check.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-app.sh

      - name: Notarize and staple app
        timeout-minutes: 15
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          APP=".build/release/aI'm Thinking.app"
          ZIP="$RUNNER_TEMP/aIm-Thinking.zip"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$ASC_KEY_P8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Create DMG
        timeout-minutes: 5
        run: |
          bash scripts/make-dmg.sh \
            ".build/release/aI'm Thinking.app" \
            "${{ needs.check.outputs.dmg }}" \
            "aI'm Thinking ${{ needs.check.outputs.version }}"

      - name: Sign DMG
        run: codesign --force --timestamp --sign "$SIGN_IDENTITY" "${{ needs.check.outputs.dmg }}"

      - name: Notarize and staple DMG
        timeout-minutes: 15
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DMG="${{ needs.check.outputs.dmg }}"
          xcrun notarytool submit "$DMG" \
            --key "$ASC_KEY_P8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify release artifact
        run: |
          DMG="${{ needs.check.outputs.dmg }}"
          codesign --verify --verbose=2 "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG" || true

      # Built before the GitHub Release so a signing failure does not leave a release behind.
      # Signing only takes seconds; a hang here means a keychain prompt, so fail fast.
      - name: Build App Store package
        id: package
        timeout-minutes: 3
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ needs.check.outputs.version }}
        run: |
          # +100 keeps CI builds above the builds uploaded by hand before CI existed (0.1.0 build 2).
          BUILD_NUMBER="$((100 + GITHUB_RUN_NUMBER)).$GITHUB_RUN_ATTEMPT"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/mas.provisionprofile"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "MAS_PKG=.build/appstore/aIm-Thinking-$MARKETING_VERSION-$BUILD_NUMBER.pkg" >> "$GITHUB_ENV"
          security cms -D -i "$RUNNER_TEMP/mas.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PYPROFILE'
          import datetime, hashlib, os, pathlib, plistlib
          profile = plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'profile.plist').read_bytes())
          team = os.environ['APPLE_TEAM_ID']
          if profile.get('TeamIdentifier') != [team]:
              raise SystemExit('Provisioning profile Team ID does not match APPLE_TEAM_ID')
          if profile.get('Entitlements', {}).get('com.apple.application-identifier') != team + '.com.den0206.AImThinking':
              raise SystemExit('Provisioning profile is not for I-m-Thinking')
          if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit('Provisioning profile has expired')
          digests = [hashlib.sha1(cert).hexdigest().upper() for cert in profile.get('DeveloperCertificates', [])]
          if os.environ['MAS_SIGN_IDENTITY'] not in digests:
              raise SystemExit('Provisioning profile does not include the selected Apple Distribution certificate')
          PYPROFILE
          BUILD_NUMBER="$BUILD_NUMBER" CONFIG=appstore \
          SIGN_IDENTITY="$MAS_SIGN_IDENTITY" \
          INSTALLER_IDENTITY="$MAS_INSTALLER_IDENTITY" \
          PROVISIONING_PROFILE="$RUNNER_TEMP/mas.provisionprofile" \
            bash scripts/build-app.sh &
          BUILD=$!
          # productbuild --sign has hung here with no output. If it does again, record where it
          # waits (Apple DTS suggests spindump) and whether a keychain prompt (SecurityAgent) is up.
          for _ in $(seq 120); do kill -0 "$BUILD" 2>/dev/null || break; sleep 1; done
          if kill -0 "$BUILD" 2>/dev/null; then
            echo "::error::App Store package build did not finish in 2 minutes"
            pgrep -lf 'SecurityAgent|productbuild|productsign' || true
            sudo spindump productbuild 5 -stdout 2>&1 | head -300 || true
            pkill -x productbuild || true
            kill "$BUILD" || true
            exit 1
          fi
          wait "$BUILD"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          DMG: ${{ needs.check.outputs.dmg }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" "$DMG" \
            --target "$GITHUB_SHA" \
            --title "aI'm Thinking ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # Return after upload; Ubuntu waits for App Store Connect processing.
      - name: Upload App Store package
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # altool reads AuthKey_<id>.p8 from API_PRIVATE_KEYS_DIR.
          API_PRIVATE_KEYS_DIR="$(dirname "$ASC_KEY_P8")" \
            xcrun altool --upload-package "$MAS_PKG" --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"

      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/keys"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/mas.p12" "$RUNNER_TEMP/mas.provisionprofile" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/developer-id-ca.cer" "$RUNNER_TEMP/wwdr-ca.cer"

  submit:
    needs: [check, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ github.run_number }}
          path: ${{ runner.temp }}
      - name: Prepare upload API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Polls for processing (up to 30 min) and review cancellation (up to 10 min).
      - name: Submit to App Store review
        timeout-minutes: 42
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_BUILD_POLL_ATTEMPTS: 90
        run: scripts/appstore-release.sh "${{ needs.check.outputs.version }}" "${{ needs.release.outputs.build_number }}" "$RUNNER_TEMP/notes.md"

      - name: Sync changelog to main
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -f -C main origin/main
          scripts/release-changelog.sh "$VERSION" "$(date -u +%F)"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: v${VERSION} の CHANGELOG を反映 [skip ci]"
          git push origin main

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
